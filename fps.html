<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tactical War 4v4: Firebase Stealth Operations</title>

    <!-- Firebase SDK Modular / Compatibility Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b1008;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #d8e6c3;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #1a2612;
        }

        /* --- MENYU VƏ OTAQ SİSTEMİ --- */
        #lobbyScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0b1207 0%, #17240e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }
        .lobby-panel {
            background: rgba(18, 28, 14, 0.92);
            border: 2px solid #526e38;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(100, 140, 60, 0.2);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .lobby-title {
            font-size: 26px;
            font-weight: 900;
            color: #a4cc6e;
            text-shadow: 0 0 10px rgba(164, 204, 110, 0.5);
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            color: #8da372;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .input-control {
            width: 100%;
            padding: 12px 15px;
            background: #0d150a;
            border: 1px solid #455e2d;
            border-radius: 6px;
            color: #d8e6c3;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        .input-control:focus {
            border-color: #a4cc6e;
            box-shadow: 0 0 8px rgba(164, 204, 110, 0.4);
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        .btn-war {
            flex: 1;
            padding: 14px;
            background: linear-gradient(180deg, #4b6630 0%, #2f421d 100%);
            border: 1px solid #73994c;
            color: #e5f2d0;
            font-weight: bold;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .btn-war:active {
            transform: translateY(2px);
            background: #2f421d;
        }
        #roomStatus {
            margin-top: 15px;
            font-size: 14px;
            color: #ffcc00;
            min-height: 20px;
        }

        /* --- HUD (İSTİFADƏÇİ İNTERFEYSİ) --- */
        .hud-top-bar {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 16, 8, 0.85);
            border: 1px solid #415729;
            padding: 8px 20px;
            border-radius: 20px;
            display: flex;
            gap: 25px;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        .team-score {
            font-weight: 900;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .score-a { color: #4287f5; }
        .score-b { color: #f54242; }
        .game-timer {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 1px;
        }
        .flag-status {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.1);
        }

        .hud-player-stats {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(10, 16, 8, 0.85);
            border: 1px solid #415729;
            padding: 10px 14px;
            border-radius: 8px;
            z-index: 10;
            width: 170px;
            backdrop-filter: blur(5px);
        }
        .hp-bar-bg {
            width: 100%;
            height: 12px;
            background: #240d0d;
            border: 1px solid #5e2121;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 4px;
        }
        .hp-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #e63939, #4caf50);
            transition: width 0.2s ease;
        }
        .weapon-info {
            margin-top: 8px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            color: #aac483;
        }

        /* --- MOBİL İDARƏETMƏ PANELİ --- */
        .controls-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 20;
        }
        #joystickZone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            pointer-events: auto;
            touch-action: none;
        }
        #joystickKnob {
            position: absolute;
            top: 50%; left: 50%;
            width: 50px; height: 50px;
            background: rgba(164, 204, 110, 0.4);
            border: 2px solid #a4cc6e;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .action-buttons {
            position: absolute;
            bottom: 25px;
            right: 25px;
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 12px;
            pointer-events: auto;
        }
        .btn-ctrl {
            background: rgba(16, 26, 12, 0.8);
            border: 2px solid #526e38;
            color: #d8e6c3;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            touch-action: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-transform: uppercase;
        }
        .btn-ctrl:active {
            background: #526e38;
            transform: scale(0.92);
        }
        #btnFire { grid-column: 3; grid-row: 1 / span 2; width: 70px; height: 70px; border-color: #e63939; color: #ff8888; font-size: 13px; }
        #btnRocket { grid-column: 2; grid-row: 1; border-color: #ff9800; color: #ffcc80; }
        #btnSprint { grid-column: 1; grid-row: 2; border-color: #2196f3; color: #90caf9; }
        #btnReload { grid-column: 2; grid-row: 2; border-color: #4caf50; color: #a5d6a7; }

        /* MINIMAP */
        #minimapCanvas {
            position: absolute;
            top: 12px;
            right: 12px;
            border: 2px solid #415729;
            background: rgba(10, 16, 8, 0.9);
            border-radius: 6px;
            z-index: 10;
        }

        /* OVERLAY ANNOUNCEMENT */
        #gameOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            display: none;
        }
        .overlay-title {
            font-size: 36px;
            font-weight: 900;
            color: #a4cc6e;
            margin-bottom: 15px;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <!-- LOBBY SCREEN -->
    <div id="lobbyScreen">
        <div class="lobby-panel">
            <div class="lobby-title">Tactical War 4v4</div>
            <div class="input-group">
                <label>Oyunçu Adı</label>
                <input type="text" id="playerNameInput" class="input-control" placeholder="Taktik Əsgər" maxlength="12">
            </div>
            <div class="input-group">
                <label>Otaq Kodu (Qoşulmaq üçün)</label>

            <div class="btn-group">

    <!-- HUD -->

            <span id="hudWeapon">AVTOMAT</span>

    <canvas id="minimapCanvas" width="110" height="110"></canvas>

    <!-- MOBİL İDARƏETMƏ LAYERİ -->

    <!-- SON NƏTİCƏ EKRANI -->

        <div class="overlay-title" id="overlayTitle">QƏLƏBƏ!</div>
        <p id="overlaySub" style="color: #ccc; margin-bottom: 20px;">Düşmən qüvvələri tamamilə məhv edildi.</p>
        <button class="btn-war" style="padding: 12px 30px;" onclick="location.reload()">ƏSAS MENYUYA QAYIT</button>
    </div>

    <script>
        /* ==========================================================================
           1. FIREBASE KONFİQURASİYASI VƏ ŞƏBƏKƏ MODULU
           ========================================================================== */
        const firebaseConfig = {
            apiKey: "AIzaSyAGtxfe6nRIhuxrmY8f7BXg-kLVHAMMZKE",
            authDomain: "game-95396.firebaseapp.com",
            projectId: "game-95396",
            storageBucket: "game-95396.firebasestorage.app",
            messagingSenderId: "680599310068",
            appId: "1:680599310068:web:ea0814f1dbe4b50c17d8a1",
            measurementId: "G-XDZG81XB25"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentRoomId = null;
        let localPlayerId = "p_" + Math.random().toString(36).substr(2, 9);
        let myTeam = "A"; // Host = A, Client = B
        let isHost = false;

        /* ==========================================================================
           2. SƏS SİNTEZATORU (Web Audio API - Səs faylları üçün modul strukturu daxilində)
           ========================================================================== */
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.audioFiles = {
                    rifle: null, // Gələcəkdə MP3/WAV faylı yükləmək üçün: new Audio('path/rifle.mp3')
                    rocket: null,
                    explosion: null
                };
            }

            init() {
                if(!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
            }

            playRifle() {
                if(this.audioFiles.rifle) { this.audioFiles.rifle.cloneNode().play(); return; }
                if(!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.08);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(now); osc.stop(now + 0.08);
            }

            playRocket() {
                if(this.audioFiles.rocket) { this.audioFiles.rocket.cloneNode().play(); return; }
                if(!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.3);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(now); osc.stop(now + 0.3);
            }

            playExplosion() {
                if(this.audioFiles.explosion) { this.audioFiles.explosion.cloneNode().play(); return; }
                if(!this.ctx) return;
                const now = this.ctx.currentTime;
                const bufSize = this.ctx.sampleRate * 0.5;
                const buffer = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass'; filter.frequency.setValueAtTime(800, now);
                filter.frequency.linearRampToValueAtTime(30, now + 0.5);
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.8, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
                noise.start(now); noise.stop(now + 0.5);
            }
        }
        const sounds = new SoundEngine();

        /* ==========================================================================
           3. OYUN KONFİQURASİYASI VƏ LABİRİNT XƏRİTƏ SİSTEMİ
           ========================================================================== */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const minimapCanvas = document.getElementById('minimapCanvas');
        const miniCtx = minimapCanvas.getContext('2d');

        const MAP_SIZE = 3200;
        const GRID_CELL = 80;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Obyektlər massivi
        const mapObstacles = [];
        const bushes = [];
        const sandbags = [];
        const clouds = [];

        // Labirint Divarları və Dekorasya Generasiyası
        function generateProceduralMap() {
            mapObstacles.length = 0;
            bushes.length = 0;
            sandbags.length = 0;

            // Xarici Divarlar
            mapObstacles.push({ x: 0, y: 0, w: MAP_SIZE, h: 40 });
            mapObstacles.push({ x: 0, y: MAP_SIZE - 40, w: MAP_SIZE, h: 40 });
            mapObstacles.push({ x: 0, y: 0, w: 40, h: MAP_SIZE });
            mapObstacles.push({ x: MAP_SIZE - 40, y: 0, w: 40, h: MAP_SIZE });

            // Daxili Labirint Strukturu
            for(let r = 2; r < MAP_SIZE / GRID_CELL - 2; r += 2) {
                for(let c = 2; c < MAP_SIZE / GRID_CELL - 2; c += 2) {
                    if(Math.random() > 0.3) {
                        let w = (Math.random() > 0.5 ? 2 : 1) * GRID_CELL;
                        let h = (w === GRID_CELL ? 2 : 1) * GRID_CELL;
                        mapObstacles.push({ x: c * GRID_CELL, y: r * GRID_CELL, w: w, h: h, type: 'wall' });
                    }
                }
            }

            // Kollar (Gizlənmək üçün)
            for(let i = 0; i < 90; i++) {
                bushes.push({
                    x: Math.random() * (MAP_SIZE - 200) + 100,
                    y: Math.random() * (MAP_SIZE - 200) + 100,
                    r: Math.random() * 25 + 20
                });
            }

            // Qum kisələri (Siper)
            for(let i = 0; i < 40; i++) {
                sandbags.push({
                    x: Math.random() * (MAP_SIZE - 300) + 150,
                    y: Math.random() * (MAP_SIZE - 300) + 150,
                    w: 60, h: 20, angle: Math.random() * Math.PI
                });
            }

            // Buludlar
            for(let i = 0; i < 15; i++) {
                clouds.push({
                    x: Math.random() * MAP_SIZE,
                    y: Math.random() * MAP_SIZE,
                    size: Math.random() * 150 + 100,
                    speed: Math.random() * 0.3 + 0.1
                });
            }
        }

        /* ==========================================================================
           4. DÖYÜŞ SUBYEKTLƏRİ (PLAYER VƏ AI ƏSGƏRLƏR)
           ========================================================================== */
        class Entity {
            constructor(id, x, y, team, isAI = false) {
                this.id = id;
                this.x = x;
                this.y = y;
                this.team = team; // "A" və ya "B"
                this.isAI = isAI;
                this.radius = 18;
                this.angle = 0;
                this.hp = isAI ? 200 : 500;
                this.maxHp = this.hp;
                this.speed = isAI ? 2.3 : 3.2;
                this.weapon = "RIFLE"; // "RIFLE" və ya "ROCKET"
                this.isDead = false;
                this.isSprinting = false;
                this.inBush = false;
                this.hasFlag = false;

                // AI İdarəetmə Dəyişənləri
                this.aiTarget = null;
                this.aiState = "PATROL"; // PATROL, ATTACK, DEFEND, CAPTURE
                this.aiChangeTimer = 0;
            }

            update() {
                if(this.isDead) return;

                // Bush / Gizlənmə testi
                this.inBush = false;
                for(let b of bushes) {
                    if(Math.hypot(this.x - b.x, this.y - b.y) < b.r) {
                        this.inBush = true;
                        break;
                    }
                }

                if(this.isAI) this.updateAI();
            }

            updateAI() {
                this.aiChangeTimer--;
                
                // Əgər Aİ komandiri izləyirsə və ya bazanı qoruyursa
                let enemyTeam = this.team === "A" ? "B" : "A";
                let enemies = allEntities.filter(e => e.team === enemyTeam && !e.isDead);

                let closestEnemy = null;
                let minDist = 400; // Baxış məsafəsi

                for(let e of enemies) {
                    let d = Math.hypot(e.x - this.x, e.y - this.y);
                    if(d < minDist && !e.inBush) {
                        minDist = d;
                        closestEnemy = e;
                    }
                }

                if(closestEnemy) {
                    // Düşmənə tərəf yönəl və atəş aç
                    let targetAngle = Math.atan2(closestEnemy.y - this.y, closestEnemy.x - this.x);
                    this.angle = targetAngle;

                    if(minDist > 120) {
                        let nx = this.x + Math.cos(this.angle) * this.speed;
                        let ny = this.y + Math.sin(this.angle) * this.speed;
                        if(checkCollision(nx, ny, this.radius)) {
                            this.x = nx; this.y = ny;
                        }
                    }

                    if(Math.random() < 0.04) {
                        shootBullet(this, this.angle, "RIFLE");
                    }
                } else {
                    // Təbii patrol / Düşmən bayrağına hücum
                    let targetBase = this.team === "A" ? baseB : baseA;
                    let angleToBase = Math.atan2(targetBase.y - this.y, targetBase.x - this.x);
                    this.angle = angleToBase;

                    let nx = this.x + Math.cos(this.angle) * (this.speed * 0.7);
                    let ny = this.y + Math.sin(this.angle) * (this.speed * 0.7);
                    if(checkCollision(nx, ny, this.radius)) {
                        this.x = nx; this.y = ny;
                    }
                }
            }

            draw(ctx) {
                if(this.isDead) return;

                ctx.save();
                ctx.translate(this.x, this.y);

                // Kölgə Effekti
                ctx.fillStyle = "rgba(0,0,0,0.3)";
                ctx.beginPath();
                ctx.arc(4, 4, this.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.rotate(this.angle);

                // Korpus
                ctx.fillStyle = this.team === "A" ? "#3b6cca" : "#ca3b3b";
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#111";
                ctx.lineWidth = 2;
                ctx.stroke();

                // Qollar / Silah
                ctx.fillStyle = "#222";
                if(this.weapon === "RIFLE") {
                    ctx.fillRect(8, 4, 16, 5); // Avtomat
                } else {
                    ctx.fillRect(6, 3, 22, 8); // Roketatan
                }

                ctx.restore();

                // HP Bar
                ctx.fillStyle = "rgba(0,0,0,0.6)";
                ctx.fillRect(this.x - 20, this.y - this.radius - 12, 40, 5);
                ctx.fillStyle = this.team === "A" ? "#4287f5" : "#f54242";
                ctx.fillRect(this.x - 20, this.y - this.radius - 12, (this.hp / this.maxHp) * 40, 5);

                // Əgər bayrağı daşıyırsa
                if(this.hasFlag) {
                    ctx.fillStyle = "#ffcc00";
                    ctx.beginPath();
                    ctx.arc(this.x, this.y - this.radius - 20, 6, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        /* ==========================================================================
           5. PLANET VƏ ZƏRƏR SİSTEMİ (GÜLLƏLƏR, PARTLAYIŞLAR)
           ========================================================================== */
        const bullets = [];
        const particles = [];

        function shootBullet(shooter, angle, type) {
            sounds.init();
            if(type === "RIFLE") sounds.playRifle();
            else sounds.playRocket();

            bullets.push({
                id: Math.random().toString(36).substr(2, 9),
                shooterId: shooter.id,
                team: shooter.team,
                x: shooter.x + Math.cos(angle) * 24,
                y: shooter.y + Math.sin(angle) * 24,
                vx: Math.cos(angle) * (type === "RIFLE" ? 14 : 9),
                vy: Math.sin(angle) * (type === "RIFLE" ? 14 : 9),
                damage: type === "RIFLE" ? 35 : 180,
                type: type,
                life: 120
            });

            // Tüstü / Giliz Partikulları
            for(let i = 0; i < 3; i++) {
                particles.push({
                    x: shooter.x, y: shooter.y,
                    vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2,
                    size: Math.random() * 4 + 2, color: "#888", alpha: 1, decay: 0.05
                });
            }
        }

        function createExplosion(x, y) {
            sounds.playExplosion();
            cameraShake = 15;

            for(let i = 0; i < 35; i++) {
                let ang = Math.random() * Math.PI * 2;
                let spd = Math.random() * 8 + 2;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
                    size: Math.random() * 8 + 4,
                    color: Math.random() > 0.5 ? "#ff4500" : "#ffcc00",
                    alpha: 1, decay: 0.03
                });
            }

            // Şok dalğası və zərər radiusu
            allEntities.forEach(e => {
                let d = Math.hypot(e.x - x, e.y - y);
                if(d < 120 && !e.isDead) {
                    e.hp -= 150 * (1 - d / 120);
                    if(e.hp <= 0) e.isDead = true;
                }
            });
        }

        /* ==========================================================================
           6. COLLISION / MƏNSƏB VƏ MAP INTEGRITY
           ========================================================================== */
        function checkCollision(nx, ny, r) {
            for(let obs of mapObstacles) {
                if(nx + r > obs.x && nx - r < obs.x + obs.w &&
                   ny + r > obs.y && ny - r < obs.y + obs.h) {
                    return false;
                }
            }
            return true;
        }

        /* ==========================================================================
           7. GLOBAL GAME STATE & BAZALAR
           ========================================================================== */
        const baseA = { x: 200, y: 200, w: 200, h: 200, flagCaptured: false };
        const baseB = { x: MAP_SIZE - 400, y: MAP_SIZE - 400, w: 200, h: 200, flagCaptured: false };

        let allEntities = [];
        let localPlayer = null;
        let camera = { x: 0, y: 0 };
        let cameraShake = 0;

        let scoreA = 0;
        let scoreB = 0;

        /* ==========================================================================
           8. MOBİL İDARƏETMƏ VƏ TOUCH EVENT-LƏR
           ========================================================================== */
        const joystickData = { active: false, x: 0, y: 0, distance: 0 };
        const joystickZone = document.getElementById('joystickZone');
        const joystickKnob = document.getElementById('joystickKnob');

        joystickZone.addEventListener('touchstart', handleJoystickStart, false);
        joystickZone.addEventListener('touchmove', handleJoystickMove, false);
        joystickZone.addEventListener('touchend', handleJoystickEnd, false);

        function handleJoystickStart(e) {
            sounds.init();
            updateJoystick(e.touches[0]);
        }
        function handleJoystickMove(e) {
            updateJoystick(e.touches[0]);
        }
        function handleJoystickEnd() {
            joystickData.active = false;
            joystickKnob.style.transform = `translate(-50%, -50%)`;
        }

        function updateJoystick(touch) {
            const rect = joystickZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            let dist = Math.hypot(dx, dy);
            let maxRadius = rect.width / 2;

            if (dist > maxRadius) {
                dx = (dx / dist) * maxRadius;
                dy = (dy / dist) * maxRadius;
                dist = maxRadius;
            }

            joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            joystickData.active = true;
            joystickData.x = dx / maxRadius;
            joystickData.y = dy / maxRadius;
            joystickData.distance = dist / maxRadius;
        }

        // Action Buttons Event Listeners
        document.getElementById('btnFire').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if(localPlayer && !localPlayer.isDead) shootBullet(localPlayer, localPlayer.angle, localPlayer.weapon);
        });

        document.getElementById('btnRocket').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if(localPlayer) {
                localPlayer.weapon = localPlayer.weapon === "RIFLE" ? "ROCKET" : "RIFLE";
                document.getElementById('hudWeapon').innerText = localPlayer.weapon;
            }
        });

        document.getElementById('btnSprint').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if(localPlayer) localPlayer.isSprinting = !localPlayer.isSprinting;
        });

        /* ==========================================================================
           9. LOBBY & FIREBASE SYSTEM INTEGRATION
           ========================================================================== */
        document.getElementById('btnCreateRoom').addEventListener('click', () => {
            sounds.init();
            let pName = document.getElementById('playerNameInput').value || "Komandir A";
            let roomId = Math.floor(100000 + Math.random() * 900000).toString();
            currentRoomId = roomId;
            isHost = true;
            myTeam = "A";

            db.ref('rooms/' + roomId).set({
                status: "waiting",
                hostName: pName,
                timer: 600
            }).then(() => {
                document.getElementById('roomStatus').innerText = "Otaq yaradıldı! Kod: " + roomId + " (İkinci oyunçu gözlənilir...)";
                listenRoomEvents(roomId);
            });
        });

        document.getElementById('btnJoinRoom').addEventListener('click', () => {
            sounds.init();
            let pName = document.getElementById('playerNameInput').value || "Komandir B";
            let code = document.getElementById('roomCodeInput').value;

            if(!code) { alert("Lütfən 6 rəqəmli otaq kodunu daxil edin."); return; }

            db.ref('rooms/' + code).once('value', (snapshot) => {
                if(snapshot.exists()) {
                    currentRoomId = code;
                    isHost = false;
                    myTeam = "B";

                    db.ref('rooms/' + code).update({
                        status: "playing",
                        clientName: pName
                    });

                    document.getElementById('roomStatus').innerText = "Otağa qoşulundu! Döyüş başlayır...";
                    listenRoomEvents(code);
                } else {
                    alert("Otaq tapılmadı!");
                }
            });
        });

        function listenRoomEvents(roomId) {
            db.ref('rooms/' + roomId).on('value', (snapshot) => {
                const data = snapshot.val();
                if(!data) return;

                if(data.status === "playing" && document.getElementById('lobbyScreen').style.display !== 'none') {
                    document.getElementById('lobbyScreen').style.display = 'none';
                    startGameMatch();
                }
            });

            // Güllə və Oyunçu Vəziyyətlərinin Sinxronizasiyası
            db.ref('rooms/' + roomId + '/bullets').on('child_added', (snapshot) => {
                const b = snapshot.val();
                if(b.shooterId !== localPlayerId) {
                    bullets.push(b);
                }
            });

            db.ref('rooms/' + roomId + '/players/' + (myTeam === "A" ? "B" : "A")).on('value', (snapshot) => {
                const remoteData = snapshot.val();
                if(remoteData) {
                    let remoteP = allEntities.find(e => e.id === remoteData.id);
                    if(remoteP) {
                        remoteP.x = remoteData.x;
                        remoteP.y = remoteData.y;
                        remoteP.angle = remoteData.angle;
                        remoteP.hp = remoteData.hp;
                        remoteP.isDead = remoteData.isDead;
                    }
                }
            });
        }

        /* ==========================================================================
           10. OYUNUN BAŞLAMA MƏNTİQİ VƏ LÖVHƏ LÖVHƏSİ
           ========================================================================== */
        function startGameMatch() {
            generateProceduralMap();

            allEntities = [];

            // Komanda A (Oyunçu + 3 AI Əsgər)
            localPlayer = new Entity(localPlayerId, myTeam === "A" ? 250 : MAP_SIZE - 250, myTeam === "A" ? 250 : MAP_SIZE - 250, myTeam);
            allEntities.push(localPlayer);

            // Komanda A AI Əsgərlər
            for(let i = 0; i < 3; i++) {
                allEntities.push(new Entity("ai_A_" + i, 200 + i * 40, 300, "A", true));
            }

            // Komanda B Oyunçu Remote Reference və AI-lər
            let enemyTeam = myTeam === "A" ? "B" : "A";
            let enemyPlayer = new Entity("remote_player", enemyTeam === "A" ? 250 : MAP_SIZE - 250, enemyTeam === "A" ? 250 : MAP_SIZE - 250, enemyTeam);
            allEntities.push(enemyPlayer);

            for(let i = 0; i < 3; i++) {
                allEntities.push(new Entity("ai_B_" + i, MAP_SIZE - 200 - i * 40, MAP_SIZE - 300, "B", true));
            }

            document.getElementById('hudPlayerName').innerText = (myTeam === "A" ? "KOMANDİR A" : "KOMANDİR B");

            // Şəbəkə Pozisiya Yayımlama Taymeri (Network Loop)
            setInterval(syncNetworkState, 50);

            requestAnimationFrame(gameLoop);
        }

        function syncNetworkState() {
            if(!currentRoomId || !localPlayer) return;

            db.ref('rooms/' + currentRoomId + '/players/' + myTeam).set({
                id: localPlayer.id,
                x: localPlayer.x,
                y: localPlayer.y,
                angle: localPlayer.angle,
                hp: localPlayer.hp,
                isDead: localPlayer.isDead
            });
        }

        /* ==========================================================================
           11. ƏSAS RENDER VƏ OYUN DÖNGÜSÜ (60 FPS OPTİMALLAŞDIRILMIŞ)
           ========================================================================== */
        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        function update() {
            if(!localPlayer) return;

            // Oyunçunun İdarə Olunması
            if(!localPlayer.isDead && joystickData.active) {
                let currentSpeed = localPlayer.speed * (localPlayer.isSprinting ? 1.6 : 1.0);
                let moveX = joystickData.x * currentSpeed;
                let moveY = joystickData.y * currentSpeed;

                let nextX = localPlayer.x + moveX;
                let nextY = localPlayer.y + moveY;

                if(checkCollision(nextX, localPlayer.y, localPlayer.radius)) localPlayer.x = nextX;
                if(checkCollision(localPlayer.x, nextY, localPlayer.radius)) localPlayer.y = nextY;

                localPlayer.angle = Math.atan2(joystickData.y, joystickData.x);
            }

            // Kamera Takibi
            camera.x = localPlayer.x - canvas.width / 2;
            camera.y = localPlayer.y - canvas.height / 2;

            if(cameraShake > 0) {
                camera.x += (Math.random() - 0.5) * cameraShake;
                camera.y += (Math.random() - 0.5) * cameraShake;
                cameraShake *= 0.9;
            }

            // Obyektlərin və AI-ların Yenilənməsi
            allEntities.forEach(e => e.update());

            // Güllələrin İdarə Olunması
            for(let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;
                b.life--;

                // Obstacle collision
                if(!checkCollision(b.x, b.y, 4)) {
                    if(b.type === "ROCKET") createExplosion(b.x, b.y);
                    bullets.splice(i, 1);
                    continue;
                }

                // Entity Collision
                allEntities.forEach(e => {
                    if(!e.isDead && e.team !== b.team && Math.hypot(e.x - b.x, e.y - b.y) < e.radius + 4) {
                        e.hp -= b.damage;
                        if(e.hp <= 0) e.isDead = true;

                        if(b.type === "ROCKET") createExplosion(b.x, b.y);
                        bullets.splice(i, 1);
                    }
                });

                if(b.life <= 0) bullets.splice(i, 1);
            }

            // Partikulların Yenilənməsi
            for(let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.alpha -= p.decay;
                if(p.alpha <= 0) particles.splice(i, 1);
            }

            // HUD Yeniləmə
            document.getElementById('hpBarFill').style.width = Math.max(0, (localPlayer.hp / localPlayer.maxHp) * 100) + "%";

            // Qələbə Şərtlərinin Yoxlanılması
            checkVictoryConditions();
        }

        function checkVictoryConditions() {
            let teamAAlive = allEntities.some(e => e.team === "A" && !e.isDead);
            let teamBAlive = allEntities.some(e => e.team === "B" && !e.isDead);

            if(!teamAAlive || !teamBAlive) {
                let winner = teamAAlive ? "A KOMANDASI" : "B KOMANDASI";
                showGameOver(winner + " QƏLƏBƏ QAZANDI!");
            }
        }

        function showGameOver(text) {
            document.getElementById('gameOverlay').style.display = 'flex';
            document.getElementById('overlayTitle').innerText = text;
        }

        /* ==========================================================================
           12. RENDER ENGINE (QRAFIKA VƏ ATMOSFER EFFEKTLƏRİ)
           ========================================================================== */
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-camera.x, -camera.y);

            // 1. OT VƏ ZƏMİ FONU
            ctx.fillStyle = "#1e2e14";
            ctx.fillRect(0, 0, MAP_SIZE, MAP_SIZE);

            // Torpaq Yollar / Grid İzləri
            ctx.strokeStyle = "rgba(0,0,0,0.15)";
            ctx.lineWidth = 2;
            for(let x = 0; x < MAP_SIZE; x += GRID_CELL) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_SIZE); ctx.stroke();
            }

            // 2. BAZALAR VƏ BAYRAQLAR
            // Base A
            ctx.fillStyle = "rgba(66, 135, 245, 0.2)";
            ctx.fillRect(baseA.x, baseA.y, baseA.w, baseA.h);
            ctx.strokeStyle = "#4287f5";
            ctx.strokeRect(baseA.x, baseA.y, baseA.w, baseA.h);

            // Base B
            ctx.fillStyle = "rgba(245, 66, 66, 0.2)";
            ctx.fillRect(baseB.x, baseB.y, baseB.w, baseB.h);
            ctx.strokeStyle = "#f54242";
            ctx.strokeRect(baseB.x, baseB.y, baseB.w, baseB.h);

            // 3. QUM KİSƏLƏRİ VƏ DİVARLAR (LABİRİNT)
            ctx.fillStyle = "#3a4d28";
            for(let obs of mapObstacles) {
                ctx.fillStyle = obs.type === 'wall' ? '#2d3d1e' : '#111';
                ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                ctx.strokeStyle = '#4e6934';
                ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
            }

            // 4. ENTITIES (OYUNÇULAR VƏ AI)
            allEntities.forEach(e => e.draw(ctx));

            // 5. KOLLAR (GİZLƏNMƏ)
            for(let b of bushes) {
                ctx.fillStyle = "rgba(34, 74, 26, 0.85)";
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fill();
            }

            // 6. GÜLLƏLƏR VƏ PARTİKULLAR
            for(let bullet of bullets) {
                ctx.fillStyle = bullet.type === "RIFLE" ? "#ffcc00" : "#ff4400";
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, bullet.type === "RIFLE" ? 3 : 6, 0, Math.PI * 2);
                ctx.fill();
            }

            for(let p of particles) {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }

            // 7. BULUDLAR (HƏRƏKƏTLİ KÖLGƏLƏR)
            ctx.fillStyle = "rgba(0,0,0,0.12)";
            for(let c of clouds) {
                c.x += c.speed;
                if(c.x > MAP_SIZE) c.x = -200;
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();

            // 8. MINIMAP RENDER
            renderMinimap();
        }

        function renderMinimap() {
            miniCtx.clearRect(0, 0, 110, 110);
            let scale = 110 / MAP_SIZE;

            // Minimap Fonu
            miniCtx.fillStyle = "rgba(15, 25, 12, 0.9)";
            miniCtx.fillRect(0, 0, 110, 110);

            // Obstacles
            miniCtx.fillStyle = "#4a6332";
            for(let obs of mapObstacles) {
                miniCtx.fillRect(obs.x * scale, obs.y * scale, obs.w * scale, obs.h * scale);
            }

            // Entities on Minimap
            allEntities.forEach(e => {
                if(!e.isDead && (!e.inBush || e.team === myTeam)) {
                    miniCtx.fillStyle = e.team === "A" ? "#4287f5" : "#f54242";
                    miniCtx.beginPath();
                    miniCtx.arc(e.x * scale, e.y * scale, 2.5, 0, Math.PI * 2);
                    miniCtx.fill();
                }
            });
        }
    </script>
</body>
